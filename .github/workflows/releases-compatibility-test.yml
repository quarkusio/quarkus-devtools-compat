name: Releases compatibility tests

on:
  schedule:
    - cron:  '0 0 * * *'
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: write
  checks: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y-%m")" >> $GITHUB_OUTPUT
        shell: bash
      - name: Cache Maven Repository
        id: cache-maven
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          # refresh cache every month to avoid unlimited growth
          key: maven-repo-${{ runner.os }}-${{ steps.get-date.outputs.date }}

      - name: Test with Maven
        run: mvn test

      - name: Push storage
        if: always()
        run: |
          git config --local user.email "quarkusbot@xam.dk"
          git config --local user.name "Quarkus Bot"
          git add ./storage/cli-compat-test/*
          if ! git diff-index --quiet HEAD; then
            git commit --quiet -m "Commit test storage"
            git push --quiet
            echo "Commited test storage"
          fi
      - name: Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
