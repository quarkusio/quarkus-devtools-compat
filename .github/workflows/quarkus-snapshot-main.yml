name: "Quarkus 4 ecosystem CI"
on:
  watch:
    types: [started]
  workflow_dispatch:

env:
  ECOSYSTEM_CI_REPO: quarkusio/quarkus-ecosystem-ci
  ECOSYSTEM_CI_REPO_FILE: context.yaml
  JAVA_VERSION: 21

  #########################
  # Repo specific setting #
  #########################

  ECOSYSTEM_CI_REPO_PATH: quarkus-devtools-compat

jobs:
  build:
    name: "Build against latest Quarkus 4 snapshot"
    runs-on: ubuntu-latest
    if: github.actor == 'quarkusbot' || github.event_name == 'workflow_dispatch' || github.actor == 'ia3andy'

    steps:
      - name: Install yq
        run: sudo snap install yq

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current-repo

      - name: Checkout Ecosystem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ECOSYSTEM_CI_REPO }}
          path: ecosystem-ci

      - name: Setup and Run Tests
        run: ./ecosystem-ci/setup-and-test
        env:
          ECOSYSTEM_CI_TOKEN: ${{ secrets.ECOSYSTEM_CI_TOKEN }}
          GH_TOKEN: ${{ secrets.ECOSYSTEM_CI_TOKEN }}
          QUARKUS_BRANCH: main
